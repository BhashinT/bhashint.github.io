<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Research Progress</title>
  <style>
    :root {
      --bg-color: #00000000;
      --completed-color: #FF0000;
      --current-color: #7fbfff;
      --future-color: #101536;
      --text-color: #e0f7ff;
      --line-color: rgba(127, 191, 255, 0.3);
      --border-radius: 8px;
    }

    
    body {
      font-family: 'Share Tech Mono', monospace;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    
    .progress-container {
      width: 100%;
      max-width: 800px;
      position: relative;
    }
    
    .progress-track {
      height: 2px;
      background-color: var(--line-color);
      position: relative;
      margin: 50px 0;
    }
    
    .progress-nodes {
      display: flex;
      justify-content: space-between;
      position: absolute;
      width: 100%;
      top: 50%;
      transform: translateY(-50%);
    }
    
    .progress-node {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background-color: var(--future-color);
      border: 2px solid rgba(0, 238, 255, 0.3);
      position: relative;
      z-index: 2;
    }
    
    .progress-node.completed {
      background-color: var(--completed-color);
      box-shadow: 0 0 10px var(--completed-color),
                 0 0 20px var(--completed-color);
    }
    
    .progress-node.current {
      background-color: var(--current-color);
      box-shadow: 0 0 15px var(--current-color);
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0% {
        box-shadow: 0 0 10px var(--current-color);
      }
      50% {
        box-shadow: 0 0 20px var(--current-color),
                   0 0 30px var(--current-color);
      }
      100% {
        box-shadow: 0 0 10px var(--current-color);
      }
    }
    
    .progress-label {
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      white-space: nowrap;
      font-size: 0.9rem;
      color: var(--text-color);
      text-transform: uppercase;
    }
    
    .progress-node.completed .progress-label {
      color: var(--completed-color);
      text-shadow: 0 0 5px var(--completed-color);
    }
    
    .progress-node.current .progress-label {
      color: var(--current-color);
      text-shadow: 0 0 5px var(--current-color);
      font-weight: bold;
    }
    
    /* Glow effect for lines between completed nodes */
    .progress-line {
      position: absolute;
      height: 2px;
      background-color: var(--line-color);
      top: 50%;
      transform: translateY(-50%);
      z-index: 1;
    }
    
    .progress-line.completed {
      background-color: var(--completed-color);
      box-shadow: 0 0 10px var(--completed-color);
    }
    
    /* Add cyberpunk scanline effect */
    .scanline {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        transparent 50%,
        rgba(0, 238, 255, 0.05) 50%
      );
      background-size: 100% 4px;
      z-index: 3;
      pointer-events: none;
    }
    
    /* Add data code effect */
    .data-code {
      position: absolute;
      font-size: 0.7rem;
      opacity: 0.4;
      color: var(--current-color);
    }
    
    .node-indicator {
      position: absolute;
      bottom: -35px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: var(--text-color);
    }
    
    .node-indicator.completed {
      color: var(--completed-color);
    }
    
    .node-indicator.current {
      color: var(--current-color);
      animation: blink 1.5s infinite;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    /* Add responsive styles */
    @media (max-width: 768px) {
      .progress-label {
        font-size: 0.7rem;
        top: -30px;
      }
      
      .progress-node {
        width: 20px;
        height: 20px;
      }
      
      .node-indicator {
        font-size: 0.6rem;
        bottom: -25px;
      }
    }
    
    /* Extra small screens - rotate labels */
    @media (max-width: 576px) {
      .progress-track {
        margin: 70px 0;
      }
      
      .progress-label {
        transform: translateX(-50%) rotate(-45deg);
        top: -45px;
      }
    }
  </style>
</head>
<body>
  <div class="progress-container">
    <div class="progress-track">
      <div class="progress-nodes">
        <!-- Node 1: Literature Review (Completed) -->
        <div class="progress-node completed">
          <div class="progress-label">Literature Review</div>
        </div>
        
        <!-- Node 2: Idea Generation (Completed) -->
        <div class="progress-node completed">
          <div class="progress-label">Idea Generation</div>
        </div>
        
        <!-- Node 3: Tangible Results (Completed) -->
        <div class="progress-node completed">
          <div class="progress-label">Tangible Results</div>
        </div>
        
        <!-- Node 4: Results Compilation (Current) -->
        <div class="progress-node completed">
          <div class="progress-label">Results Compilation</div>
        </div>
        
        <!-- Node 5: Publish! (Future) -->
        <div class="progress-node current">
          <div class="progress-label">Publish!</div>
        </div>
      </div>
      
      <!-- Lines between nodes -->
      <div class="progress-line completed" style="left: 0; width: 25%;"></div>
      <div class="progress-line completed" style="left: 25%; width: 25%;"></div>
      <div class="progress-line completed" style="left: 50%; width: 25%;"></div>
      <div class="progress-line current" style="left: 75%; width: 25%;"></div>
    </div>
    

</body>
</html>
